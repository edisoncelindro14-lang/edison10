services:
  joytel-proxy:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      - PROXY_PORT=8000
      - JOYTEL_API_BASE=https://api.joytel.com
      - PROXY_TOKEN=kabaroload-proxy-2024
    command: node proxy/joytel-proxy.cjs

  web:
    image: node:22
    working_dir: /app
    depends_on:
      - joytel-proxy
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - JOYTEL_PROXY_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - JOYTEL_PROXY_TOKEN=kabaroload-proxy-2024
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"
